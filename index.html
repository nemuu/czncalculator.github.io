<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡厄斯PT计算器</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Inter字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* 自定义样式 */
        body {
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
            background-color: #1a1b26; /* 深色背景 */
            color: #c0caf5; /* 默认文字颜色 */
        }
        
        /* 模拟图片中的UI元素颜色 */
        .calc-bg {
            background-color: #24283b; /* 卡片背景 */
        }
        
        .display-box {
            background-color: #1a1b26; /* 深色输入框背景 */
            border: 1px solid #414868;
        }
        
        .btn-purple {
            background-color: #7aa2f7; /* 按钮颜色 - 调整为蓝色系以匹配主题 */
            color: #1a1b26; /* 按钮文字颜色 */
            transition: background-color 0.2s;
        }
        .btn-purple:hover {
            background-color: #9ece6a; /* 按钮悬停颜色 */
        }
        .btn-purple:active {
            transform: scale(0.95);
        }
        
        .btn-gray {
            background-color: #414868; /* 灰色按钮 */
            color: #c0caf5;
            transition: background-color 0.2s;
        }
        .btn-gray:hover {
            background-color: #565f89;
        }
        .btn-gray:active {
            transform: scale(0.95);
        }

        .tab {
            background-color: #414868;
            color: #c0caf5;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tab.active {
            background-color: #7aa2f7; /* 激活的Tab颜色 */
            color: #1a1b26;
            font-weight: bold;
        }
        
        .pt-display {
            background-color: #7aa2f7;
            color: #1a1b26;
        }

        .pt-display.over-limit {
            background-color: #f7768e; /* PT超限时的红色 */
            color: #1a1b26;
        }
        
        .reset-btn {
            background: none;
            border: 1px solid #7aa2f7;
            color: #7aa2f7;
            transition: all 0.2s;
        }
        .reset-btn:hover {
            background-color: rgba(122, 162, 247, 0.1);
        }

        /* 隐藏原生number输入框的箭头 */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* (新) 自定义弹窗样式 */
        /* (已移除) .modal-overlay, .modal-content CSS */
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="calc-bg w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
        
        <!-- 顶部：等级和PT上限 -->
        <div class="grid grid-cols-2 gap-4">
            <div class="space-y-1">
                <label class="text-sm font-medium" for="chaos-level">当前卡厄斯等级</label>
                <div class="flex items-center">
                    <button id="level-minus" class="btn-gray w-10 h-10 rounded-l-lg text-xl font-bold">-</button>
                    <input id="chaos-level" type="number" value="12" class="display-box w-full h-10 text-center text-lg font-bold" readonly>
                    <button id="level-plus" class="btn-gray w-10 h-10 rounded-r-lg text-xl font-bold">+</button>
                </div>
            </div>
            <div class="space-y-1">
                <label class="text-sm font-medium">卡厄斯PT上限</label>
                <div id="pt-limit" class="display-box w-full h-10 rounded-lg flex items-center justify-center text-lg font-bold">
                    140
                </div>
            </div>
        </div>

        <!-- 角色标签页 -->
        <div class="grid grid-cols-3 gap-2">
            <button id="tab-1" class="tab active h-20 rounded-lg flex flex-col items-center justify-center">
                <span>角色1</span>
                <span class="text-xs">当前PT:</span>
                <span id="pt-display-1" class="pt-display text-lg font-bold px-3 py-0.5 rounded-md mt-1">150</span>
            </button>
            <button id="tab-2" class="tab h-20 rounded-lg flex flex-col items-center justify-center">
                <span>角色2</span>
                <span class="text-xs">当前PT:</span>
                <span id="pt-display-2" class="pt-display text-lg font-bold px-3 py-0.5 rounded-md mt-1">0</span>
            </button>
            <button id="tab-3" class="tab h-20 rounded-lg flex flex-col items-center justify-center">
                <span>角色3</span>
                <span class="text-xs">当前PT:</span>
                <span id="pt-display-3" class="pt-display text-lg font-bold px-3 py-0.5 rounded-md mt-1">0</span>
            </button>
        </div>

        <!-- 重置按钮 -->
        <div class="text-center">
            <button id="reset-btn" class="reset-btn text-sm rounded-full px-4 py-1.5">
                ↻ 重置 <span id="reset-char-name">角色1</span> 计数
            </button>
        </div>

        <!-- 计数器网格 -->
        <div id="calculator-inputs" class="space-y-3">
            <!-- 占位符 - JS将在此处填充内容 -->
        </div>

    </div>

    <!-- 计数器项的HTML模板 -->
    <template id="counter-template">
        <div class="grid grid-cols-2 gap-4">
            <!-- 左侧计数器 -->
            <div class="space-y-1">
                <label class="text-sm font-medium" data-label="left-label">中立卡数量</label>
                <div class="flex items-center">
                    <button data-btn="left-minus" class="btn-purple w-10 h-10 rounded-l-lg text-xl font-bold">-</button>
                    <input data-input="left-input" type="number" value="0" class="display-box w-full h-10 text-center text-lg font-bold" readonly>
                    <button data-btn="left-plus" class="btn-purple w-10 h-10 rounded-r-lg text-xl font-bold">+</button>
                </div>
            </div>
            <!-- 右侧计数器 -->
            <div class="space-y-1">
                <label class="text-sm font-medium" data-label="right-label">怪物卡数量</label>
                <div class="flex items-center">
                    <button data-btn="right-minus" class="btn-purple w-10 h-10 rounded-l-lg text-xl font-bold">-</button>
                    <input data-input="right-input" type="number" value="0" class="display-box w-full h-10 text-center text-lg font-bold" readonly>
                    <button data-btn="right-plus" class="btn-purple w-10 h-10 rounded-r-lg text-xl font-bold">+</button>
                </div>
            </div>
        </div>
    </template>
    
    <!-- 单行计数器模板 (用于奇数个) -->
    <template id="counter-template-single">
        <div class="space-y-1">
            <label class="text-sm font-medium" data-label="single-label">中立卡、怪物卡普通灵光-闪数量</label>
            <div class="flex items-center max-w-xs mx-auto">
                <button data-btn="single-minus" class="btn-purple w-10 h-10 rounded-l-lg text-xl font-bold">-</button>
                <input data-input="single-input" type="number" value="0" class="display-box w-full h-10 text-center text-lg font-bold" readonly>
                <button data-btn="single-plus" class="btn-purple w-10 h-10 rounded-r-lg text-xl font-bold">+</button>
            </div>
        </div>
    </template>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- 状态管理 ---
            
            // 默认值，所有计数为0
            const defaultInputs = {
                neutralCards: 0,
                monsterCards: 0,
                forbiddenCards: 0,
                divineAuraFlashes: 0,
                normalAuraFlashes: 0,
                deleteCharCardCount: 0,
                deleteOtherCardCount: 0,
                copyCount: 0,
                transformCount: 0,
            };

            // (旧) 图片中的示例值 - 不再需要，全部使用defaultInputs
            /*
            const sampleInputs = {
                neutralCards: 2,
                ...
                transformCount: 2,
            };
            */

            let state = {
                chaosLevel: 12,
                ptLimit: 140,
                activeCharacterId: 1,
                characters: [
                    { ...defaultInputs }, // 角色1使用默认值
                    { ...defaultInputs }, // 角色2使用默认值
                    { ...defaultInputs }  // 角色3使用默认值
                ]
            };

            // --- UI 元素 ---
            const chaosLevelInput = document.getElementById('chaos-level');
            const ptLimitDisplay = document.getElementById('pt-limit');
            const levelMinusBtn = document.getElementById('level-minus');
            const levelPlusBtn = document.getElementById('level-plus');
            const resetBtn = document.getElementById('reset-btn');
            const resetCharName = document.getElementById('reset-char-name');
            const tabs = [
                document.getElementById('tab-1'), 
                document.getElementById('tab-2'), 
                document.getElementById('tab-3')
            ];
            const ptDisplays = [
                document.getElementById('pt-display-1'),
                document.getElementById('pt-display-2'),
                document.getElementById('pt-display-3')
            ];

            // (新) Modal elements
            /* (已移除) modal, modalText, modalCancel, modalConfirm 变量 */
            
            // 计数器定义
            const countersConfig = [
                { id: 'neutralCards', label: '中立卡数量' },
                { id: 'monsterCards', label: '怪物卡数量' },
                { id: 'forbiddenCards', label: '禁忌卡数量' },
                { id: 'divineAuraFlashes', label: '神之灵光-闪次数' },
                { id: 'normalAuraFlashes', label: '中立卡、怪物卡普通灵光-闪数量' },
                { id: 'deleteCharCardCount', label: '删除角色卡次数' },
                { id: 'deleteOtherCardCount', label: '删除其它卡次数' },
                { id: 'copyCount', label: '复制次数' },
                { id: 'transformCount', label: '转化次数' },
            ];

            const calculatorInputsContainer = document.getElementById('calculator-inputs');
            const template = document.getElementById('counter-template');
            const templateSingle = document.getElementById('counter-template-single');
            
            // 存储对动态创建的输入框的引用
            let inputElements = {};

            // --- 计算逻辑 ---

            // 删除成本表
            const deleteCharTiers = [20, 30, 50, 70, 90];
            const deleteOtherTiers = [0, 10, 30, 50, 70];

            /**
             * 计算累进删除成本
             * @param {number} count - 删除次数
             * @param {number[]} tiers - 成本等级数组
             * @returns {number} 总成本
             */
            function calculateDeletionCost(count, tiers) {
                let totalCost = 0;
                const maxTier = tiers.length - 1;
                for (let i = 1; i <= count; i++) {
                    if (i - 1 <= maxTier) {
                        totalCost += tiers[i - 1];
                    } else {
                        totalCost += tiers[maxTier]; // 超过5次按最后一次的成本算
                    }
                }
                return totalCost;
            }

            /**
             * 计算指定角色的总PT
             * @param {number} charId - 角色ID (1, 2, or 3)
             * @returns {number} 总PT
             */
            function calculateTotalPT(charId) {
                const inputs = state.characters[charId - 1];
                
                // 1. 基础PT (Base PT)
                const neutralPT = inputs.neutralCards * 20;
                const monsterPT = inputs.monsterCards * 80;
                const forbiddenPT = inputs.forbiddenCards * 20;
                const basePT = neutralPT + monsterPT + forbiddenPT;

                // 2. 灵光一闪PT (Aura Flash PT)
                const normalAuraPT = inputs.normalAuraFlashes * 10;
                const divineAuraPT = inputs.divineAuraFlashes * 20;
                const auraPT = normalAuraPT + divineAuraPT;
                
                // 3. 删除成本 (Deletion Cost) - 这是减分项
                const deleteCharCost = calculateDeletionCost(inputs.deleteCharCardCount, deleteCharTiers);
                const deleteOtherCost = calculateDeletionCost(inputs.deleteOtherCardCount, deleteOtherTiers);
                
                // 4. 复制和转化 (Copy & Transform)
                // (变更) 复制次数 规则同 删除其它卡次数
                const copyPT = calculateDeletionCost(inputs.copyCount, deleteOtherTiers);
                const transformPT = inputs.transformCount * 10; // (变更) 转化固定+10

                // 总PT - (变更) 删除卡牌现在是 *增加* PT
                const totalPT = basePT + auraPT + deleteCharCost + deleteOtherCost + copyPT + transformPT;
                
                return totalPT;
            }

            // --- UI 更新 ---

            /**
             * 更新所有UI元素以匹配当前状态
             */
            function updateUI() {
                // 更新等级和上限
                chaosLevelInput.value = state.chaosLevel;
                state.ptLimit = (state.chaosLevel * 10) + 20;
                ptLimitDisplay.textContent = state.ptLimit;
                
                // 更新Tab激活状态
                tabs.forEach((tab, index) => {
                    if (index + 1 === state.activeCharacterId) {
                        tab.classList.add('active');
                    } else {
                        tab.classList.remove('active');
                    }
                });

                // 更新所有角色的PT显示
                ptDisplays.forEach((display, index) => {
                    const charId = index + 1;
                    const totalPT = calculateTotalPT(charId);
                    display.textContent = totalPT;
                    
                    // 检查是否超限
                    if (totalPT > state.ptLimit) {
                        display.classList.add('over-limit');
                    } else {
                        display.classList.remove('over-limit');
                    }
                });

                // 更新重置按钮文本
                resetCharName.textContent = `角色${state.activeCharacterId}`;
                
                // 更新当前激活角色的计数器输入框
                const activeInputs = state.characters[state.activeCharacterId - 1];
                for (const id in activeInputs) {
                    if (inputElements[id]) {
                        inputElements[id].value = activeInputs[id];
                    }
                }
            }
            
            // --- 动态创建计数器 ---
            function createCounters() {
                calculatorInputsContainer.innerHTML = ''; // 清空
                inputElements = {}; // 重置引用

                for (let i = 0; i < countersConfig.length; i += 2) {
                    const config1 = countersConfig[i];
                    const config2 = countersConfig[i + 1];

                    if (config2) {
                        // 创建双列
                        const row = template.content.cloneNode(true);
                        
                        setupCounter(row, config1, 'left');
                        setupCounter(row, config2, 'right');
                        
                        calculatorInputsContainer.appendChild(row);
                    } else {
                        // 创建单列 (用于最后一个)
                        const row = templateSingle.content.cloneNode(true);
                        
                        setupCounter(row, config1, 'single');
                        
                        calculatorInputsContainer.appendChild(row);
                    }
                }
            }

            /**
             * 辅助函数：设置单个计数器
             * @param {DocumentFragment} row - 模板行
             * @param {object} config - 计数器配置
             * @param {string} prefix - 'left', 'right', or 'single'
             */
            function setupCounter(row, config, prefix) {
                const label = row.querySelector(`[data-label="${prefix}-label"]`);
                const minusBtn = row.querySelector(`[data-btn="${prefix}-minus"]`);
                const input = row.querySelector(`[data-input="${prefix}-input"]`);
                const plusBtn = row.querySelector(`[data-btn="${prefix}-plus"]`);
                
                label.textContent = config.label;
                label.htmlFor = config.id;
                input.id = config.id;
                
                // 存储引用
                inputElements[config.id] = input;
                
                // 添加事件监听
                minusBtn.addEventListener('click', () => handleCountChange(config.id, -1));
                plusBtn.addEventListener('click', () => handleCountChange(config.id, 1));
            }


            // --- 事件处理 ---
            
            // 等级变更
            levelMinusBtn.addEventListener('click', () => {
                if (state.chaosLevel > 1) {
                    state.chaosLevel--;
                    updateUI();
                }
            });
            
            levelPlusBtn.addEventListener('click', () => {
                state.chaosLevel++;
                updateUI();
            });

            // 计数器变更
            function handleCountChange(id, delta) {
                const activeInputs = state.characters[state.activeCharacterId - 1];
                const currentValue = activeInputs[id];
                if (currentValue + delta >= 0) {
                    activeInputs[id] = currentValue + delta;
                    updateUI();
                }
            }

            // 切换Tab
            tabs.forEach((tab, index) => {
                tab.addEventListener('click', () => {
                    state.activeCharacterId = index + 1;
                    updateUI();
                });
            });
            
            // 重置按钮
            resetBtn.addEventListener('click', () => {
                // (变更) 移除弹窗，直接重置
                state.characters[state.activeCharacterId - 1] = { ...defaultInputs };
                updateUI();
            });
            
            // (新) Modal listeners
            /* (已移除) modalCancel, modalConfirm 事件监听 */


            // --- 初始化 ---
            createCounters();
            updateUI();
        });
    </script>

    <!-- (新) 自定义确认弹窗 -->
    <!-- (已移除) id="confirm-modal" 的整个 div -->

</body>
</html>
