<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡厄斯存档数据模拟器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 拖动时的样式 */
        .sortable-ghost {
            opacity: 0.4;
            background: #4a5568; /* gray-700 */
        }
        .sortable-drag {
            opacity: 1 !important;
            background: #2d3748; /* gray-800 */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-lg */
        }
        /* 拖动 handle */
        .drag-handle {
            cursor: move; /* or cursor: grab */
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-gray-900 text-gray-200 font-sans p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <h1 class="text-4xl font-bold text-white mb-2">卡厄斯存档数据模拟器</h1>
        <p class="text-lg text-gray-400 mb-8">添加卡牌并选择参数以计算总积分。</p>

        <!-- 卡牌行容器 -->
        <div id="cards-container" class="space-y-4">
            <!-- 卡牌行将在这里动态插入 -->
        </div>

        <!-- 卡牌行模板 -->
        <template id="card-row-template">
            <div class="card-row bg-gray-800 rounded-lg shadow-lg border border-gray-700 transition-all duration-300">
                <!-- UPDATED: Grid layout changed to md:grid-cols-12, added items-center -->
                <div class="grid grid-cols-1 md:grid-cols-12 gap-x-4 gap-y-2 p-4 items-center">
                    
                    <!-- NEW: Drag Handle -->
                    <div class="md:col-span-1 flex items-center justify-center text-gray-500 drag-handle" title="拖动排序">
                        <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                           <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5" />
                        </svg>
                    </div>

                    <!-- 1. 稀有度 -->
                    <!-- UPDATED: md:col-span-2 -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-400 mb-1">卡牌稀有度</label>
                        <select class="w-full bg-gray-900 text-white border border-gray-700 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500 card-parameter" data-param="rarity">
                            <option value="none" data-points="0">无 (0)</option>
                            <option value="common" data-points="1">一般 (1)</option>
                            <option value="rare" data-points="2">稀有 (2)</option>
                            <option value="epic" data-points="4">史诗 (4)</option>
                            <option value="legendary" data-points="8">传说 (8)</option>
                        </select>
                    </div>

                    <!-- 2. 操作 -->
                    <!-- UPDATED: md:col-span-1 -->
                    <div class="md:col-span-1">
                        <label class="block text-sm font-medium text-gray-400 mb-1">操作</label>
                        <select class="w-full bg-gray-900 text-white border border-gray-700 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500 card-parameter" data-param="operation">
                            <option value="none">无</option>
                            <option value="remove">移除</option>
                            <option value="transform">转换</option>
                        </select>
                    </div>

                    <!-- 3. 转换后稀有度 (隐藏) -->
                    <!-- UPDATED: md:col-span-2 -->
                    <div class="md:col-span-2 transformed-rarity-container" style="display: none;">
                        <label class="block text-sm font-medium text-gray-400 mb-1">转换后稀有度</label>
                        <select class="w-full bg-gray-900 text-white border border-gray-700 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500 card-parameter" data-param="transformedRarity">
                            <option value="none" data-points="0">无 (0)</option>
                            <option value="common" data-points="1">一般 (1)</option>
                            <option value="rare" data-points="2">稀有 (2)</option>
                            <option value="epic" data-points="4">史诗 (4)</option>
                            <option value="legendary" data-points="8">传说 (8)</option>
                        </select>
                    </div>

                    <!-- 4. 闪卡/效果 -->
                    <!-- UPDATED: md:col-span-2 -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-400 mb-1">闪卡/效果</label>
                        <select class="w-full bg-gray-900 text-white border border-gray-700 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500 card-parameter" data-param="effect">
                            <option value="none" data-points="0">无 (0)</option>
                            <option value="normal_flash" data-points="2">普闪 (2)</option>
                            <option value="super_flash" data-points="3">神闪 (3)</option>
                            <option value="positive" data-points="5">正面效果 (5)</option>
                            <option value="positive_super" data-points="10">正面效果+神闪 (10)</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>

                    <!-- 5. 自定义效果 (隐藏) -->
                    <!-- UPDATED: md:col-span-1 -->
                    <div class="md:col-span-1 custom-effect-container" style="display: none;">
                        <label class="block text-sm font-medium text-gray-400 mb-1">自定义 (0-12)</label>
                        <input type="number" min="0" max="12" value="0" class="w-full bg-gray-900 text-white border border-gray-700 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500 card-parameter" data-param="customEffectValue">
                    </div>

                    <!-- 6. 是否带出 -->
                    <!-- UPDATED: md:col-span-2 -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-400 mb-1">是否带出</label>
                        <select class="w-full bg-gray-900 text-white border border-gray-700 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500 card-parameter" data-param="carryOut">
                            <option value="not_carried" data-points="0">未带出 (0)</option>
                            <option value="no_loss" data-points="1">无损带出 (1)</option>
                            <option value="loss" data-points="-2">有损带出 (-2)</option>
                            <option value="re_enter" data-points="-2">重入构筑 (-2)</option>
                        </select>
                    </div>
                    
                    <!-- 7. 行总分 和 删除/复制按钮 -->
                    <!-- UPDATED: md:col-span-1 -->
                    <div class="md:col-span-1 flex flex-col items-end justify-between h-full pt-2">
                        <div class="text-right w-full">
                            <span class="text-xs text-gray-400">卡牌总分</span>
                            <div class="text-2xl font-bold text-white row-total">0</div>
                            <span class="beyond-eighth-label text-xs font-medium text-yellow-400" style="display: none;">(8张外)</span>
                        </div>
                        <div class="flex space-x-3 mt-2">
                            <button class="copy-card-btn text-sm text-blue-400 hover:text-blue-300 transition duration-200">
                                复制
                            </button>
                            <button class="remove-card-btn text-sm text-red-400 hover:text-red-300 transition duration-200">
                                删除
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        <!-- 模板结束 -->

        <!-- 操作按钮 -->
        <div class="flex justify-start mb-6 space-x-4 mt-6">
            <button id="add-card-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-200">
                + 添加新卡牌
            </button>
            <button id="fill-defaults-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-200">
                默认全开 (8张)
            </button>
            <button id="reset-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-200">
                重置数据
            </button>
        </div>

        <!-- 总结分 -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-xl mt-8">
            <h2 class="text-2xl font-semibold text-white mb-4">总计</h2>
            <div class="flex justify-between items-center mb-2">
                <span class="text-lg text-gray-400">总复制次数:</span>
                <span id="copy-count" class="text-2xl font-bold text-blue-400">0</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-lg text-gray-400">总积分:</span>
                <span id="grand-total" class="text-3xl font-bold text-green-400">0</span>
            </div>
        </div>

    </div>

    <!-- NEW: SortableJS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cardsContainer = document.getElementById('cards-container');
            const addCardBtn = document.getElementById('add-card-btn');
            const fillDefaultsBtn = document.getElementById('fill-defaults-btn');
            const resetBtn = document.getElementById('reset-btn');
            const cardRowTemplate = document.getElementById('card-row-template');
            const grandTotalEl = document.getElementById('grand-total');
            const copyCountEl = document.getElementById('copy-count');

            let totalCopyCount = 0;

            // --- NEW: Initialize SortableJS ---
            new Sortable(cardsContainer, {
                animation: 150, // 动画
                handle: '.drag-handle', // 指定拖动 handle
                ghostClass: 'sortable-ghost', // 拖动占位符的样式
                dragClass: 'sortable-drag', // 正在拖动的项目的样式
                // 拖动结束时触发
                onEnd: () => {
                    // 订单已更改，重新计算所有总数
                    // (SortableJS 已经更新了 DOM 顺序)
                    calculateAllTotals();
                }
            });
            // --- END NEW ---

            // 添加新卡牌
            function addNewCard(calculateNow = true, isCopy = false) {
                const newRow = cardRowTemplate.content.cloneNode(true).firstElementChild;
                
                // 设置默认值
                newRow.querySelector('[data-param="carryOut"]').value = 'no_loss';

                // 附加事件监听器
                attachListenersToRow(newRow);

                // 如果是复制行
                if (isCopy) {
                    newRow.classList.add('opacity-70', 'border-dashed', 'border-blue-400');
                    newRow.setAttribute('data-is-copy', 'true');
                }
                
                cardsContainer.appendChild(newRow);
                
                if (calculateNow) {
                    calculateAllTotals();
                }
                return newRow;
            }

            // 为一行中的所有元素附加监听器
            function attachListenersToRow(row) {
                // 1. 所有参数的通用监听器
                row.querySelectorAll('.card-parameter').forEach(paramEl => {
                    const eventType = (paramEl.tagName === 'INPUT') ? 'input' : 'change';
                    paramEl.addEventListener(eventType, () => {
                        // 特殊逻辑：显示/隐藏自定义输入框
                        if (paramEl.dataset.param === 'effect') {
                            const customContainer = row.querySelector('.custom-effect-container');
                            customContainer.style.display = (paramEl.value === 'custom') ? 'block' : 'none';
                        }
                        // 特殊逻辑：显示/隐藏转换稀有度
                        if (paramEl.dataset.param === 'operation') {
                             const transformedRarityContainer = row.querySelector('.transformed-rarity-container');
                            transformedRarityContainer.style.display = (paramEl.value === 'transform') ? 'block' : 'none';
                            // 如果不是 transform，重置
                            if (paramEl.value !== 'transform') {
                                row.querySelector('[data-param="transformedRarity"]').value = 'none';
                            }
                        }
                        calculateAllTotals();
                    });
                });

                // 2. 删除按钮
                row.querySelector('.remove-card-btn').addEventListener('click', (e) => {
                    const rowToRemove = e.target.closest('.card-row');
                    
                    // 防止删除最后一行
                    if (cardsContainer.children.length <= 1) {
                        return; // 或者显示一个消息
                    }
                    
                    rowToRemove.remove();
                    calculateAllTotals();
                });

                // 3. 复制按钮
                row.querySelector('.copy-card-btn').addEventListener('click', (e) => {
                    const originalRow = e.target.closest('.card-row');
                    
                    const newCopiedRow = addNewCard(false, true); // 添加卡牌，标记为复制
                    originalRow.after(newCopiedRow); // 放在原卡牌之后
                    
                    // 继承值
                    newCopiedRow.querySelector('[data-param="rarity"]').value = originalRow.querySelector('[data-param="rarity"]').value;
                    newCopiedRow.querySelector('[data-param="effect"]').value = originalRow.querySelector('[data-param="effect"]').value;
                    newCopiedRow.querySelector('[data-param="customEffectValue"]').value = originalRow.querySelector('[data-param="customEffectValue"]').value;
                    newCopiedRow.querySelector('[data-param="carryOut"]').value = originalRow.querySelector('[data-param="carryOut"]').value;

                    // 如果原卡是自定义，显示自定义输入框
                    if (newCopiedRow.querySelector('[data-param="effect"]').value === 'custom') {
                         newCopiedRow.querySelector('.custom-effect-container').style.display = 'block';
                    }

                    // 增加复制次数
                    totalCopyCount++;
                    copyCountEl.textContent = totalCopyCount;

                    calculateAllTotals(); // 重新计算
                });
            }


            // 计算所有总分
            function calculateAllTotals() {
                let grandTotal = 0;
                const allRows = cardsContainer.querySelectorAll('.card-row');

                allRows.forEach((row, index) => {
                    // 1. 基础点数 (稀有度)
                    const rarityEl = row.querySelector('[data-param="rarity"]');
                    const basePoints = parseInt(rarityEl.options[rarityEl.selectedIndex].dataset.points || 0);

                    // 2. 操作点数
                    const operation = row.querySelector('[data-param="operation"]').value;
                    let operationPoints = 0;
                    if (operation === 'remove') {
                        operationPoints = basePoints; // 挂钩稀有度
                    } else if (operation === 'transform') {
                        const transformedRarityEl = row.querySelector('[data-param="transformedRarity"]');
                        const transformedPoints = parseInt(transformedRarityEl.options[transformedRarityEl.selectedIndex].dataset.points || 0);
                        operationPoints = basePoints + transformedPoints; // 基础 + 转换后
                    }

                    // 3. 效果点数
                    const effectEl = row.querySelector('[data-param="effect"]');
                    let effectPoints = 0;
                    if (effectEl.value === 'custom') {
                        effectPoints = parseInt(row.querySelector('[data-param="customEffectValue"]').value || 0);
                        if (effectPoints < 0) effectPoints = 0;
                        if (effectPoints > 12) effectPoints = 12;
                    } else {
                        effectPoints = parseInt(effectEl.options[effectEl.selectedIndex].dataset.points || 0);
                    }

                    // 4. 带出点数
                    const carryOutEl = row.querySelector('[data-param="carryOut"]');
                    const carryOutPoints = parseInt(carryOutEl.options[carryOutEl.selectedIndex].dataset.points || 0);
                    
                    // --- 基础行总分 (X) ---
                    const baseRowTotal = basePoints + operationPoints + effectPoints + carryOutPoints;
                    
                    // --- 逻辑：计算最终行总分 (倍率) ---
                    const isCopied = row.hasAttribute('data-is-copy');
                    const isBeyondEighth = (index >= 8); // 索引从0开始，第9张卡 index 为 8
                    
                    let finalRowTotal = baseRowTotal;

                    // 检查倍率
                    if (isCopied) {
                        finalRowTotal += baseRowTotal; // x+x
                    }
                    if (isBeyondEighth) {
                        finalRowTotal += baseRowTotal; // x+x (如果也是复制的，则为 x+x+x)
                    }
                    
                    // 更新 UI
                    row.querySelector('.row-total').textContent = finalRowTotal;
                    
                    const beyondLabel = row.querySelector('.beyond-eighth-label');
                    if (isBeyondEighth) {
                        beyondLabel.style.display = 'inline';
                    } else {
                        beyondLabel.style.display = 'none';
                    }

                    grandTotal += finalRowTotal;
                });

                // 更新总分
                grandTotalEl.textContent = grandTotal;
            }

            // 按钮点击事件
            addCardBtn.addEventListener('click', () => {
                addNewCard(true); // Standard add
            });

            // "默认全开" 按钮
            fillDefaultsBtn.addEventListener('click', () => {
                cardsContainer.innerHTML = '';
                totalCopyCount = 0;
                copyCountEl.textContent = '0';

                const defaultRarities = [
                    'common', 'common', 'common', // 3x 一般
                    'rare', 'rare', 'rare',     // 3x 稀有
                    'epic',                     // 1x 史诗
                    'legendary'                 // 1x 传说
                ];

                defaultRarities.forEach(rarity => {
                    const newRow = addNewCard(false);
                    newRow.querySelector('[data-param="rarity"]').value = rarity;
                });

                calculateAllTotals();
            });

            // "重置" 按钮
            resetBtn.addEventListener('click', () => {
                cardsContainer.innerHTML = '';
                totalCopyCount = 0;
                copyCountEl.textContent = '0';
                addNewCard(true);
            });

            // 页面加载时自动添加一行
            addNewCard(true);
        });
    </script>
</body>
</html>
